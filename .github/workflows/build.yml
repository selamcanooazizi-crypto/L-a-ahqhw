name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Unzip
        run: |
          ls -la
          find . -maxdepth 3 -name '*.zip' -not -path './proj/*' -print0 | while IFS= read -r -d '' f; do
            if unzip -l "$f" | grep -q 'build.gradle'; then
              unzip -o "$f" -d proj
            fi
          done
          test -f proj/build.gradle
      - name: Build
        working-directory: proj
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PikachuClient-1.21.4
          path: proj/build/libs/*.jar
